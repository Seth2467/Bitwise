{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Resources</title>

    <link rel="stylesheet" href="{% static 'css/unit_list.css' %}">
    <link rel="stylesheet" href="{% static 'css/navigation.css' %}">

</head>

<body>

    {% include 'partials/navigation.html' %}

    <div class="container">

        <h1>Study Resources</h1>

        <p class="subtitle">
            Electrical and Electronic Engineering
        </p>

        <input
            type="text"
            id="unitSearch"
            class="search-box"
            placeholder="Search by unit code or unit name..."
            aria-label="Search units"
        >

        <div class="unit-grid" id="unitGrid">

            {% for unit in units %}

                <a
                    href="{% url 'unit_resource_categories' unit.id %}"
                    class="unit-card"
                >

                    <div class="unit-code">
                        {{ unit.code }}
                    </div>

                    <div class="unit-name">
                        {{ unit.name }}
                    </div>

                    <span class="view-link">
                        View resources &rarr;
                    </span>

                </a>

            {% empty %}

                <p class="empty-message">
                    Units not available yet!
                </p>

            {% endfor %}

        </div>

    </div>

    <script src="{% static 'js/unit_list.js' %}"></script>
    <script src="{% static 'js/navigation.js' %}"></script>

</body>

</html>
